[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
alloy = { version = "0.8", features = ["full", "rpc-types"] }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
