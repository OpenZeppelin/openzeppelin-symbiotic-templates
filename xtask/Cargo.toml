[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0"
publish = false

[dependencies]
alloy = { version = "0.8", features = ["full", "rpc-types"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
eyre = "0.6"
oz-keystore = "0.1.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
