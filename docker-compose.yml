# OpenZeppelin Symbiotic Templates - Docker Compose
#
# Profiles:
#   - infra: Just chains (anvil, anvil-settlement)
#   - deploy: Contract deployment (contract-deployer, config-updater)
#   - dev: All services (includes infra)
#
# Usage:
#   make start    # Smart start (deploys if needed, starts all)
#   make stop     # Stop all (preserve state)
#   make clean    # Full reset

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # BLOCKCHAIN NODES
  # ═══════════════════════════════════════════════════════════════════════════

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.2.3
    container_name: anvil
    profiles: [infra, deploy, dev]
    entrypoint: ["anvil"]
    command: >-
      --port 8545
      --chain-id 31337
      --timestamp 1761983767
      --auto-impersonate
      --block-time 1
      --slots-in-an-epoch 2
      --accounts 10
      --balance 10000
      --gas-limit 30000000000
      --code-size-limit 50000
      --state /data/state.json
      --state-interval 30
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
    ports:
      - "8545:8545"
    volumes:
      - ./data/anvil-source:/data
    networks:
      - bridge-network
    healthcheck:
      test: ["CMD", "cast", "client", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 1s
      retries: 10

  anvil-settlement:
    image: ghcr.io/foundry-rs/foundry:v1.2.3
    container_name: anvil-settlement
    profiles: [infra, deploy, dev]
    entrypoint: ["anvil"]
    command: >-
      --port 8546
      --chain-id 31338
      --timestamp 1761983767
      --auto-impersonate
      --block-time 1
      --slots-in-an-epoch 2
      --accounts 10
      --balance 10000
      --gas-limit 30000000000
      --state /data/state.json
      --state-interval 30
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
    ports:
      - "8546:8546"
    volumes:
      - ./data/anvil-dest:/data
    networks:
      - bridge-network
    healthcheck:
      test: ["CMD", "cast", "client", "--rpc-url", "http://localhost:8546"]
      interval: 2s
      timeout: 1s
      retries: 10

  # ═══════════════════════════════════════════════════════════════════════════
  # CONTRACT DEPLOYMENT (one-shot)
  # ═══════════════════════════════════════════════════════════════════════════

  contract-deployer:
    image: ghcr.io/foundry-rs/foundry:v1.2.3
    container_name: contract-deployer
    profiles: [deploy]
    working_dir: /app/contracts
    volumes:
      - ./contracts:/app/contracts
      - ./data/deploy-data:/app/contracts/deploy-data
    environment:
      DEPLOYER_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      PRIVATE_KEY: "${PRIVATE_KEY}"
    networks:
      - bridge-network
    depends_on:
      anvil:
        condition: service_healthy
      anvil-settlement:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        # Check if already deployed
        if [ -f /app/contracts/deploy-data/relay-infra-complete.marker ]; then
          echo 'All contracts already deployed, skipping...'
          exit 0
        fi

        echo '=== Phase 1: Parallel deployments (DVN source + Settlement + Relay infra) ==='
        # These 3 have no dependencies on each other
        (
          echo '[1/3] Deploying DVN on source chain...'
          forge script script/DeployDVN.s.sol:DeployDVN \
            --sig "deploySource()" \
            --rpc-url http://anvil:8545 \
            --broadcast \
            --private-key $$PRIVATE_KEY \
            --quiet
          echo '[1/3] ✓ DVN source deployed'
        ) &
        (
          echo '[2/3] Deploying Settlement on dest chain...'
          forge script script/DeployDVN.s.sol:DeployDVN \
            --sig "deploySettlement()" \
            --rpc-url http://anvil-settlement:8546 \
            --broadcast \
            --private-key $$PRIVATE_KEY \
            --quiet
          echo '[2/3] ✓ Settlement deployed'
        ) &
        (
          echo '[3/3] Deploying Relay infrastructure...'
          forge script script/DeployRelayInfra.s.sol:DeployRelayInfra \
            --rpc-url http://anvil:8545 \
            --broadcast \
            --private-key $$PRIVATE_KEY \
            --code-size-limit 50000 \
            --quiet
          echo '[3/3] ✓ Relay infra deployed'
        ) &
        wait

        echo '=== Phase 2: Deploy DVN on dest chain (needs Settlement address) ==='
        SETTLEMENT_ADDR=$$(sed -n 's/.*"settlement":[[:space:]]*"\(0x[^"]*\)".*/\1/p' /app/contracts/deploy-data/settlement_contract.json)
        echo "Settlement address: $$SETTLEMENT_ADDR"
        forge script script/DeployDVN.s.sol:DeployDVN \
          --sig "deployDest(address)" $$SETTLEMENT_ADDR \
          --rpc-url http://anvil-settlement:8546 \
          --broadcast \
          --private-key $$PRIVATE_KEY \
          --quiet

        echo '=== All Deployments Complete ==='
        date > /app/contracts/deploy-data/deployment-complete.marker

  config-updater:
    image: alpine:3.19
    container_name: config-updater
    profiles: [deploy]
    volumes:
      - ./scripts/post-deploy-config.sh:/scripts/post-deploy-config.sh:ro
      - ./data/deploy-data:/deploy-data
      - ./config/sidecar/config.json:/sidecar-config/config.json
      - ./config/oz-monitor/monitors:/oz-monitor-config:rw
    environment:
      DEPLOY_DATA_DIR: /deploy-data
      CONFIG_FILE: /sidecar-config/config.json
      OZ_MONITOR_CONFIG_DIR: /oz-monitor-config
      MARKER_TIMEOUT: "300"
    networks:
      - bridge-network
    depends_on:
      contract-deployer:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        apk add --no-cache bash jq
        /scripts/post-deploy-config.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # OZ MONITOR - Event watching
  # ═══════════════════════════════════════════════════════════════════════════

  oz-monitor:
    image: openzeppelin/openzeppelin-monitor:latest
    container_name: oz-monitor
    profiles: [dev]
    environment:
      METRICS_PORT: "${METRICS_PORT:-8081}"
      METRICS_ENABLED: "${METRICS_ENABLED:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      IN_DOCKER: "true"
      # Multi-operator webhook fanout
      WEBHOOK_URL_1: "http://operator-1:3000/webhook/events"
      WEBHOOK_URL_2: "http://operator-2:3000/webhook/events"
      WEBHOOK_URL_3: "http://operator-3:3000/webhook/events"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
    restart: on-failure:5
    mem_swappiness: 0
    security_opt:
      - no-new-privileges
    volumes:
      - ./config/oz-monitor:/app/config/:ro
      - ./data/oz-monitor:/app/data
    networks:
      - bridge-network
    # Note: config-updater (deploy profile) runs before dev profile via Makefile ordering

  # ═══════════════════════════════════════════════════════════════════════════
  # REDIS - Job queue for OZ Relayer
  # ═══════════════════════════════════════════════════════════════════════════

  redis:
    image: redis:bookworm
    container_name: redis
    profiles: [dev]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --save 60 1
    networks:
      - bridge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # OZ RELAYER - Transaction submission
  # ═══════════════════════════════════════════════════════════════════════════

  oz-relayer:
    image: openzeppelin/openzeppelin-relayer:latest
    container_name: oz-relayer
    profiles: [dev]
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_REQUESTS_PER_SECOND: "100"
      RATE_LIMIT_BURST: "200"
      API_KEY: "${OZ_RELAYER_API_KEY}"
      WEBHOOK_SIGNING_KEY: "${OZ_RELAYER_WEBHOOK_SECRET}"
      KEYSTORE_PASSPHRASE: "${KEYSTORE_PASSPHRASE}"
    volumes:
      - ./config/oz-relayer:/app/config:ro
      - ./config/oz-relayer/networks:/app/config/networks:ro
    networks:
      - bridge-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get({hostname:'localhost',port:8080,path:'/api/v1/health',headers:{'Authorization':'Bearer '+process.env.API_KEY}}, r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # SYMBIOTIC RELAY SIDECARS - BLS signing
  # ═══════════════════════════════════════════════════════════════════════════

  symbiotic-relay-1:
    image: symbioticfi/relay:latest
    container_name: symbiotic-relay-1
    profiles: [dev]
    command: ["/config/start-sidecar.sh", "1"]
    cpus: 0.25
    environment:
      OPERATOR_INDEX: "0"
      SIDECAR_SECRET_KEYS: "${SIDECAR_1_SECRET_KEYS:-}"
      EVM_SOURCE_RPC: http://anvil:8545
      EVM_DEST_RPC: http://anvil-settlement:8546
    volumes:
      - ./config/symbiotic-relay:/config:ro
      - ./data/sidecar-1:/storage
      - ./data/deploy-data:/deploy-data:ro
    ports:
      - "8081:8080"
      - "8881:8880"
    networks:
      - bridge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: on-failure:5

  symbiotic-relay-2:
    image: symbioticfi/relay:latest
    container_name: symbiotic-relay-2
    profiles: [dev]
    command: ["/config/start-sidecar.sh", "2"]
    cpus: 0.25
    environment:
      OPERATOR_INDEX: "1"
      SIDECAR_SECRET_KEYS: "${SIDECAR_2_SECRET_KEYS:-}"
      EVM_SOURCE_RPC: http://anvil:8545
      EVM_DEST_RPC: http://anvil-settlement:8546
    volumes:
      - ./config/symbiotic-relay:/config:ro
      - ./data/sidecar-2:/storage
      - ./data/deploy-data:/deploy-data:ro
    ports:
      - "8082:8080"
      - "8882:8880"
    networks:
      - bridge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: on-failure:5

  symbiotic-relay-3:
    image: symbioticfi/relay:latest
    container_name: symbiotic-relay-3
    profiles: [dev]
    command: ["/config/start-sidecar.sh", "3"]
    cpus: 0.25
    environment:
      OPERATOR_INDEX: "2"
      SIDECAR_SECRET_KEYS: "${SIDECAR_3_SECRET_KEYS:-}"
      EVM_SOURCE_RPC: http://anvil:8545
      EVM_DEST_RPC: http://anvil-settlement:8546
    volumes:
      - ./config/symbiotic-relay:/config:ro
      - ./data/sidecar-3:/storage
      - ./data/deploy-data:/deploy-data:ro
    ports:
      - "8083:8080"
      - "8883:8880"
    networks:
      - bridge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: on-failure:5

  # ═══════════════════════════════════════════════════════════════════════════
  # OPERATORS - Event coordinators and proof submitters (x3)
  # ═══════════════════════════════════════════════════════════════════════════

  operator-1:
    build:
      context: ./operator
      dockerfile: Dockerfile
    image: operator:latest
    container_name: operator-1
    profiles: [dev]
    environment:
      RUST_LOG: "${LOG_LEVEL:-info},operator=debug"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      OZ_RELAYER_API_KEY: "${OZ_RELAYER_API_KEY}"
      OZ_RELAYER_WEBHOOK_SECRET: "${OZ_RELAYER_WEBHOOK_SECRET}"
    volumes:
      - ./config/operator-1:/config:ro
      - ./data/deploy-data:/deploy-data:ro
      - operator-1-data:/app/data
    ports:
      - "3001:3000"
    networks:
      - bridge-network
    depends_on:
      symbiotic-relay-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/healthz",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 35s
    restart: unless-stopped
    command: ["--config", "/config/config.json"]

  operator-2:
    build:
      context: ./operator
      dockerfile: Dockerfile
    image: operator:latest
    container_name: operator-2
    profiles: [dev]
    environment:
      RUST_LOG: "${LOG_LEVEL:-info},operator=debug"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      OZ_RELAYER_API_KEY: "${OZ_RELAYER_API_KEY}"
      OZ_RELAYER_WEBHOOK_SECRET: "${OZ_RELAYER_WEBHOOK_SECRET}"
    volumes:
      - ./config/operator-2:/config:ro
      - ./data/deploy-data:/deploy-data:ro
      - operator-2-data:/app/data
    ports:
      - "3002:3000"
    networks:
      - bridge-network
    depends_on:
      symbiotic-relay-2:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/healthz",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 35s
    restart: unless-stopped
    command: ["--config", "/config/config.json"]

  operator-3:
    build:
      context: ./operator
      dockerfile: Dockerfile
    image: operator:latest
    container_name: operator-3
    profiles: [dev]
    environment:
      RUST_LOG: "${LOG_LEVEL:-info},operator=debug"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      OZ_RELAYER_API_KEY: "${OZ_RELAYER_API_KEY}"
      OZ_RELAYER_WEBHOOK_SECRET: "${OZ_RELAYER_WEBHOOK_SECRET}"
    volumes:
      - ./config/operator-3:/config:ro
      - ./data/deploy-data:/deploy-data:ro
      - operator-3-data:/app/data
    ports:
      - "3003:3000"
    networks:
      - bridge-network
    depends_on:
      symbiotic-relay-3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/healthz",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 35s
    restart: unless-stopped
    command: ["--config", "/config/config.json"]

networks:
  bridge-network:
    driver: bridge

volumes:
  redis-data:
  operator-1-data:
  operator-2-data:
  operator-3-data:
