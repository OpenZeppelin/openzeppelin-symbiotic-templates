[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.25"

# Remappings are in remappings.txt (supports scoped remappings for transitive deps)

fs_permissions = [{ access = 'read-write', path = './' }, { access = 'read', path = '../config' }]

# Compiler settings
optimizer = true
optimizer_runs = 200
via_ir = false  # Temporarily disabled to debug compilation issues
# NOTE: do NOT pin evm_version = "paris" (Chainlink's build target): @symbioticfi/relay-contracts
# BLS libs need Cancun (mcopy). Resolver CREATE2 address parity is unaffected — it deploys from
# @chainlink/contracts-ccip's published creation bytecode, never from a local compile.

# Test settings
fuzz = { runs = 256 }
ffi = true

# RPC endpoints
[rpc_endpoints]
local = "http://localhost:8545"
anvil = "http://127.0.0.1:8545"

# Etherscan API keys (for verification)
[etherscan]
# Add your API keys here when needed

# Gas reports
# gas_reports = ["*"]

# Formatter settings
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"
