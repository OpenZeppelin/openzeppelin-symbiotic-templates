[package]
name = "layerzero_dvn_worker"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ethers = { version = "2.0", default-features = false, features = ["abigen", "rustls", "ws"] }
hex = "0.4"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.11", features = ["tls", "tls-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.11"
